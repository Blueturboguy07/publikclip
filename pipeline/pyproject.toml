[project]
name = "publikclip-pipeline"
version = "0.2.0"
description = "publikclip processing pipeline: long video in, scored vertical clips out"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "librosa>=0.10",
    "numba>=0.60",
    "onnxruntime>=1.20",
    "opencv-python-headless>=4.10",
    "python-speech-features>=0.6",
    "scenedetect>=0.6.4",
    "scikit-learn>=1.5",
    "scipy>=1.14",
    "speechbrain>=1.0",
    "torchlibrosa>=0.1.0",
    "whisperx==3.8.6",
]

[project.scripts]
publikclip = "publikclip_pipeline.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["publikclip_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]

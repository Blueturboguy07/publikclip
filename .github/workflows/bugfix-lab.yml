name: bugfix-lab

on:
  workflow_dispatch:
  push:
    branches:
      - fix/publikclip-windows-build-cargo-not-found

jobs:
  oracle:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Run oracle
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/bugfix-lab/publikclip-windows-build-cargo-not-found-single-session.ps1

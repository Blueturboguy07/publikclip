# The Windows VM test: everything a Windows user's machine would do, on a
# clean windows-latest runner — resolve the Python env, fetch a
# caption-capable ffmpeg, pass the full pipeline test suite, build the NSIS
# installer, install it silently, and launch the real installed app.
# The Windows install guide stays honest only while this stays green.
name: windows

on:
  push:
    branches: [main, win-port]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      # Keep every cache/download inside the workspace so nothing collides
      # with other jobs on a shared runner image.
      PUBLIKCLIP_HOME: ${{ github.workspace }}\.publikclip-home
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: pipeline/uv.lock

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Resolve the pipeline env (uv sync on Windows)
        working-directory: pipeline
        run: uv sync

      - name: Fetch caption-capable ffmpeg (Windows static build)
        working-directory: pipeline
        run: |
          uv run python -c "from publikclip_pipeline.render import ffmpeg_bin; ok = ffmpeg_bin.ensure_capable(); print('resolved:', ffmpeg_bin.resolve()); assert ok, 'no subtitles-capable ffmpeg on Windows'"
          # The test suite isolates PUBLIKCLIP_HOME per-test, which hides the
          # fetch above — PUBLIKCLIP_FFMPEG is the resolution order's first
          # stop, so the render smoke test runs against the real fetched exe.
          Add-Content $env:GITHUB_ENV "PUBLIKCLIP_FFMPEG=$env:PUBLIKCLIP_HOME\bin\ffmpeg.exe"

      - name: Pipeline test suite on Windows
        working-directory: pipeline
        run: uv run pytest -q

      - name: Build the app + NSIS installer
        working-directory: app
        run: |
          npm ci
          npx tauri build --bundles nsis

      # After the build, deliberately: tauri-build wants app/dist and the
      # staged src-tauri/resources, and both are produced by the step above.
      - name: Shell unit tests (publik provisioning shapes)
        working-directory: app/src-tauri
        run: cargo test

      - name: Install silently and launch the installed app
        shell: pwsh
        run: |
          $setup = Get-ChildItem app/src-tauri/target/release/bundle/nsis -Filter *-setup.exe | Select-Object -First 1
          if (-not $setup) { throw "no NSIS installer produced" }
          Write-Host "installer: $($setup.Name)"
          Start-Process -FilePath $setup.FullName -ArgumentList "/S" -Wait
          $dir = Join-Path $env:LOCALAPPDATA "publikclip"
          if (-not (Test-Path $dir)) { throw "install dir missing: $dir" }
          $exe = Get-ChildItem $dir -Filter *.exe |
            Where-Object { $_.Name -notmatch "uninstall" } |
            Select-Object -First 1
          if (-not $exe) { throw "no app exe under $dir" }
          Write-Host "launching $($exe.FullName)"
          Start-Process -FilePath $exe.FullName
          Start-Sleep -Seconds 15
          $proc = Get-Process -Name $exe.BaseName -ErrorAction Stop
          Write-Host "app alive after 15s (pid $($proc.Id)) — killing"
          Stop-Process -Id $proc.Id -Force

      - uses: actions/upload-artifact@v4
        with:
          name: publikclip-windows-setup
          path: app/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

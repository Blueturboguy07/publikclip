[package]
name = "publikclip-app"
version = "0.2.11"
description = "publikclip — long video in, scored vertical clips out"
license = "AGPL-3.0-or-later"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
# Signed self-update (src/updates.rs, docs/updates.md). The updater plugin 2.13+ needs tauri 2.12.
tauri-plugin-updater = "2.14"
tokio = { version = "1", features = ["time"] }

[dev-dependencies]
# The daily-check test in src/updates.rs runs the schedule on tokio's paused clock (fake timers).
tokio = { version = "1", features = ["rt", "time", "test-util"] }

[profile.release]
strip = true
lto = true
